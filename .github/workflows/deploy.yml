name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          cd web
          pnpm run lint
          pnpm run lint:css

      - name: Scan for leaked API keys
        run: |
          cd web
          node scripts/check-api-key-leaks.js

      # 较大的改动先过快速 sanity（lint + 关键用例），再跑全量
      - name: Sanity
        run: python3 scripts/run_sanity.py

      - name: Test with coverage
        run: |
          cd web
          pnpm run test:coverage

      - name: Coverage gate
        run: |
          cd web
          node scripts/coverage-check.js --no-run

      # footer 展示用：把本次提交的时间（committer date）传给构建，页面上换算成北京时间
      - name: Resolve commit metadata
        run: echo "VITE_GIT_TIME=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd web
          pnpm run build
        env:
          VITE_TAROT_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VITE_GIT_SHA: ${{ github.sha }}

      # 失败时把检查日志带出来，便于定位（日志平时只落本地 logs/）
      - name: Upload check logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Copy files to dist
        run: |
          cp web/*.txt dist/ 2>/dev/null || true
          cp web/public/CNAME dist/ 2>/dev/null || true
          cp web/public/.nojekyll dist/ 2>/dev/null || true

      - name: Deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
