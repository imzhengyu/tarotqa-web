name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install dependencies
        run: |
          cd web
          rm -rf node_modules pnpm-lock.yaml
          pnpm install

      - name: Lint
        run: |
          cd web
          pnpm run lint
          pnpm run lint:css

      - name: Build
        run: |
          cd web
          pnpm run build
        env:
          VITE_DEFAULT_API_KEY: ${{ secrets.DEFAULT_MINIMAX_API_KEY }}
          VITE_GIT_SHA: ${{ github.sha }}

      - name: Copy files to dist
        run: |
          cp web/*.txt dist/ 2>/dev/null || true
          cp web/public/CNAME dist/ 2>/dev/null || true
          cp web/public/.nojekyll dist/ 2>/dev/null || true

      - name: Deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4