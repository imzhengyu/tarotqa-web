<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TarotQA - AI塔罗</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 字体全部自托管（web/public/fonts，Fontsource 的 Noto Sans SC 子集）：
         国内访问 Google 的字体 CDN 会被阻断，字体必须自己发。
         核心子集（core，524KB）给网页 @font-face 与 PDF 导出共用，导出时基本命中缓存。
         注意：**不要**在这里 preload 字体 —— 慢网下它会和首屏 JS 抢带宽、并让 load 事件迟迟不触发。 -->
  </head>
  <body>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
