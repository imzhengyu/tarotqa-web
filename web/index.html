<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TarotQA - AI塔罗</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 字体全部自托管（web/public/fonts，Fontsource 的 Noto Sans SC 子集）：
         国内访问 fonts.googleapis.com / fonts.gstatic.com 会被阻断，外链字体会拖慢甚至卡住首屏，
         自托管的同一份 woff2 也直接给 PDF 导出复用（见 utils/exportPdf.js），导出时基本命中缓存。 -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/noto-sans-sc-zh-400.woff2" crossorigin>
  </head>
  <body>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
