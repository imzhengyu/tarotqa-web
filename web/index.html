<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TarotQA - AI塔罗</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 网页字体走 ZeoSeven Fonts 的 FontAPI（国内平台，ID 309 = 京华老宋体 / KingHwaOldSong，
         衬线体，单一字重）。api 形式：
           https://fontsapi.zeoseven.com/<字体ID>/main/result.css
         不要写回 fonts.googleapis.com / fonts.gstatic.com（国内被阻断）。
         用 media=print + onload 换成 all：CSS 不阻塞首屏，配合 font-display: swap 先显示系统字体。
         PDF 导出用的字体是自托管的 Noto Sans SC 子集，见 utils/exportPdf.js。 -->
    <link rel="preconnect" href="https://fontsapi.zeoseven.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fontsapi.zeoseven.com/309/main/result.css"
      media="print"
      onload="this.media='all'"
    >
    <noscript><link rel="stylesheet" href="https://fontsapi.zeoseven.com/309/main/result.css"></noscript>
  </head>
  <body>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('spa-redirect');
        if (redirect) {
          sessionStorage.removeItem('spa-redirect');
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
